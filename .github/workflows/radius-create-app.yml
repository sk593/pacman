# This workflow is auto-generated by Radius to create a Radius application.
# It authenticates with the cloud provider, connects to the Kubernetes cluster,
# and creates a Radius application.
name: Radius - Create Application

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub Environment name'
        required: true
        default: 'dev'
      app_name:
        description: 'Radius application name'
        required: true
        default: 'myapp'

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  APP_NAME: ${{ inputs.app_name }}
  RAD_VERSION: 'stable'

jobs:
  create-app:
    name: Create Radius Application
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \\
            --resource-group "${{ vars.RADIUS_RESOURCE_GROUP }}" \\
            --name "${{ vars.RADIUS_K8S_CLUSTER }}" \\
            --overwrite-existing

      - name: Install Radius CLI
        run: |
          curl -fsSL "https://get.radapp.dev/tools/rad/install.sh" | /bin/bash
          rad version

      - name: Initialize Radius
        run: |
          rad install kubernetes --set rp.publicEndpointOverride=localhost
          rad group create default
          rad workspace create kubernetes default --group default
          rad env create "$ENVIRONMENT" --namespace "${{ vars.RADIUS_K8S_NAMESPACE || 'default' }}"
          rad env switch "$ENVIRONMENT"

      - name: Create application
        run: |
          echo "Creating Radius application: $APP_NAME"
          rad app create "$APP_NAME" --environment "$ENVIRONMENT"
          echo ""
          echo "\u2705 Application '$APP_NAME' created successfully."

      - name: Show application status
        if: always()
        run: |
          rad app list || true
