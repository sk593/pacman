# This workflow is auto-generated by Radius to verify cloud credentials.
# It uses the credentials stored in the GitHub Environment to authenticate
# with the cloud provider and run a simple verification command.
name: Radius - Verify Cloud Credentials

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub Environment name'
        required: true
        default: 'dev'

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    name: Verify aws credentials
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS access
        run: |
          echo "Verifying AWS access..."
          aws sts get-caller-identity
          echo ""
          echo "Listing S3 buckets..."
          aws s3 ls || true
          echo ""
          echo "✅ AWS credentials are working correctly."

