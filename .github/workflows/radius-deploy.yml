# This workflow is auto-generated by Radius to deploy applications.
# It installs the Radius CLI, configures cloud credentials, and runs rad deploy.
name: Radius - Deploy Application

on:
  push:
    branches: [main]
    paths:
      - 'app.bicep'
      - 'bicepconfig.json'
      - '*.bicep'
      - '.github/workflows/radius-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub Environment name'
        required: true
        default: 'dev'
      app_file:
        description: 'Bicep application file to deploy'
        required: true
        default: 'app.bicep'

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  APP_FILE: ${{ inputs.app_file || 'app.bicep' }}
  RAD_VERSION: 'stable'

jobs:
  deploy:
    name: Deploy with Radius
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sk593/radius-runner:latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ vars.RADIUS_RESOURCE_GROUP }}" \
            --name "${{ vars.RADIUS_K8S_CLUSTER }}" \
            --overwrite-existing

      - name: Verify tools
        run: |
          rad version
          kubectl version --client

      - name: Initialize Radius
        run: |
          rad install kubernetes --set rp.publicEndpointOverride=localhost
          rad group create default
          rad workspace create kubernetes default --group default
          rad env create "$ENVIRONMENT" --namespace "${{ vars.RADIUS_K8S_NAMESPACE || 'default' }}"
          rad env switch "$ENVIRONMENT"

      - name: Deploy application
        run: |
          echo "Deploying $APP_FILE to environment $ENVIRONMENT..."
          rad deploy "$APP_FILE" --environment "$ENVIRONMENT"
          echo ""
          echo "✅ Deployment complete."

      - name: Show application status
        if: always()
        run: |
          rad app list || true
          rad resource list --environment "$ENVIRONMENT" || true
